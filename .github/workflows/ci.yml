name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # se a cobertura ficar abaixo de 70% o vitest falha aqui
      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      # relatorio de cobertura em html, da pra baixar no actions
      - name: Guardar relatorio de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage
