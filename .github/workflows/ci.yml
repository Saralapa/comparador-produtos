name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      # para se tiver dependencia com falha de seguranca alta ou critica
      - name: Verificar dependencias
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      # se a cobertura ficar abaixo de 70% o vitest falha aqui
      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      # relatorio de cobertura em html, da pra baixar no actions
      - name: Guardar relatorio de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage

  # procura senha ou token que tenha ido sem querer pro repositorio
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
